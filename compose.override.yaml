services:
  database:
    ports:
      - "3306"

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

  redis:
    ports:
      - "6379"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "80"
    depends_on:
      - database
    environment:
      PMA_HOST: database
      PMA_USER: root
      UPLOAD_LIMIT: 500M
