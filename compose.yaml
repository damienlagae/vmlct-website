services:
  database:
    image: mariadb:11.4
    volumes:
      - database_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: "app"
      MYSQL_PASSWORD: "password123"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  database_data:
