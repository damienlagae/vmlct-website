name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Set image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/ci:php8.4" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/ci/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    needs: [build-image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install PHP-CS-Fixer
        run: composer install --prefer-dist --no-progress -d tools/php-cs-fixer

      - name: Install PHPStan
        run: composer install --prefer-dist --no-progress -d tools/phpstan

      - name: Install Rector
        run: composer install --prefer-dist --no-progress -d tools/rector

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: |
            tools/*/vendor
          key: ${{ runner.os }}-tools-${{ hashFiles('tools/*/composer.lock') }}

  lint:
    needs: [build-image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint YAML
        run: bin/console lint:yaml config translations --parse-tags

      - name: Lint Twig
        run: bin/console lint:twig src/Shared/templates src/Page/templates src/Module

      - name: Lint Container
        run: bin/console lint:container

      - name: Validate composer.json
        run: composer validate --no-check-publish

  analyze:
    needs: [build-image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install PHP-CS-Fixer
        run: composer install --prefer-dist --no-progress -d tools/php-cs-fixer

      - name: Check code style
        run: tools/php-cs-fixer/vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Install PHPStan
        run: composer install --prefer-dist --no-progress -d tools/phpstan

      - name: Run PHPStan
        run: tools/phpstan/vendor/bin/phpstan analyse

  test:
    needs: [build-image, build]
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: app
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install importmap assets
        run: bin/console importmap:install --env=test

      - name: Create database
        run: bin/console doctrine:database:create --if-not-exists --env=test
        env:
          DATABASE_URL: "mysql://root@database:3306/app?serverVersion=mariadb-11.4.10"

      - name: Run migrations
        run: bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=test
        env:
          DATABASE_URL: "mysql://root@database:3306/app?serverVersion=mariadb-11.4.10"

      - name: Run tests
        run: bin/phpunit --testdox
        env:
          DATABASE_URL: "mysql://root@database:3306/app?serverVersion=mariadb-11.4.10"
