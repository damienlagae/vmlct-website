framework:
    html_sanitizer:
        sanitizers:
            # Used at render time on TextBlock content (and any other rich-text
            # block) to make sure stored HTML can be safely emitted with |raw.
            block_text:
                allow_safe_elements: true
                allow_relative_links: true
                allow_static_elements: false
                allow_elements:
                    a: ['href', 'title', 'target', 'rel']
                    p: []
                    br: []
                    strong: []
                    em: []
                    u: []
                    ul: []
                    ol: []
                    li: []
                    blockquote: []
                    code: []
                    pre: []
                allow_attributes:
                    target: ['a']
                    rel: ['a']
