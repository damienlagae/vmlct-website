liip_imagine:
    driver: 'gd'
    loaders:
        default:
            flysystem:
                filesystem_service: 'default.storage'
    data_loader: default
    resolvers:
        default:
            web_path:
                web_root: '%kernel.project_dir%/public'
                cache_prefix: 'media/cache'
    cache: default

    # Filter names are scoped to their module (sponsor_*, team_*, news_*, ...)
    # — no generic "thumbnail" / "logo" / "hero" buckets shared across modules,
    # so the dimensions match each module's actual layout and can evolve
    # independently.
    filter_sets:
        sponsor_logo:
            quality: 85
            filters:
                thumbnail: { size: [400, 400], mode: inset }
                background: { size: [400, 400], position: center, color: '#ffffff' }

        team_photo:
            quality: 85
            filters:
                thumbnail: { size: [600, 600], mode: outbound }

        article_cover:
            quality: 85
            filters:
                thumbnail: { size: [1280, 720], mode: outbound }

        article_card:
            quality: 80
            filters:
                thumbnail: { size: [600, 400], mode: outbound }
